name: Android debug APK
on:
  push:
    branches:
      - dev/m6-android-hardening
  workflow_dispatch:
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Create Capacitor Android project
        run: npm run android:init
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK for verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pawchive-mobile-m6-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
