name: Android debug APK
on:
  push:
    branches:
      - dev/m6-android-hardening
      - dev/m7-uidt
      - dev/m8-progress-recovery
      - dev/m9-transport-qa
      - dev/m9-1-ui-qa
  workflow_dispatch:
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and sync Capacitor Android project
        run: npm run android:init
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK (unsigned for release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pawchive-mobile-m9-1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
