name: Source checks
on:
  push:
  pull_request:
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-source.cjs
      - run: node scripts/test-install-native.mjs
      - run: bash scripts/test-transfer-core.sh
