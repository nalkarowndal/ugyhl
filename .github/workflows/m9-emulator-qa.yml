name: M9.1 Android UI diagnostics
on:
  push:
    branches: [dev/m9-1-ui-qa]
  workflow_dispatch:
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run android:init
          cd android && ./gradlew :app:assembleDebug --stacktrace
      - name: Emulator Android 15 boot, launch and relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/emulator-smoke.sh
      - name: Preserve screenshot and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawchive-m9-emulator-qa
          path: qa-output/
          if-no-files-found: ignore
