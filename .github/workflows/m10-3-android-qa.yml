name: M10.3 Android retry and Keystore recovery QA
on:
  push:
    branches: [dev/m10-3-retry-idempotency]
  workflow_dispatch:
jobs:
  android-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile pinned M9.1 APK
        run: |
          git checkout --detach 190c4a860eb3c15d66ddb2d49fbf2b5b5c55fbf7
          npm install --no-audit --no-fund
          npm run android:init
          (cd android && ./gradlew :app:assembleDebug --stacktrace)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pawchive-m9-1-old.apk"
      - name: Compile M10.3 with SAME signing key
        run: |
          git checkout --detach "$GITHUB_SHA"
          rm -rf android
          npm install --no-audit --no-fund
          npm test
          npm run build
          npm run test:url-privacy
          npm run android:init
          (cd android && ./gradlew :app:assembleDebug --stacktrace)
      - name: Android 15 native retry and missing-key fallback QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/m10-migration-smoke.sh "$RUNNER_TEMP/pawchive-m9-1-old.apk" "android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Preserve migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawchive-m10-3-retry-evidence
          path: qa-output/m10-migration/
          if-no-files-found: ignore
      - name: Save M10.3 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pawchive-m10-3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
